name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formulae:
    runs-on: macos-14
    steps:
      - uses: Homebrew/actions/setup-homebrew@main

      - name: Trust tap
        run: brew trust --tap ayush272002/tap

      - name: Style
        run: brew style ayush272002/tap

      - name: Audit, install and test
        run: |
          for f in Formula/*.rb; do
            name="ayush272002/tap/$(basename "$f" .rb)"
            echo "::group::$name"
            brew audit --strict --online --formula "$name"
            brew install --formula "$name"
            brew test "$name"
            echo "::endgroup::"
          done
